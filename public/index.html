<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c0e14">
<title>Midnight Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Nunito:wght@600;800;900&display=swap">
<style>
:root {
  --bg: #0c0e14;
  --panel: #161a24;
  --panel2: #1f2533;
  --line: #34405a;
  --text: #eef2fa;
  --dim: #9aa6bd;
  --gold: #f5c542;
  --good: #4ade80;
  --bad: #f87171;
  --ghost: #7dffb0;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Nunito, system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
canvas#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
[hidden] { display: none !important; }

/* ---------- HUD */
#hud { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); z-index: 3; }
.hbtn { background: var(--panel2); border: 2px solid var(--line); border-radius: 14px; padding: 6px 14px; font-weight: 900; font-size: 18px; min-height: 46px; min-width: 46px; box-shadow: 0 3px 0 #05060a; }
#lvlName { font-family: Creepster, Nunito, sans-serif; font-size: clamp(20px, 3.2vmin, 30px); letter-spacing: 1px; color: #ffd98a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; text-shadow: 0 2px 0 #3b2400; }
#coins { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 6px 12px; font-weight: 900; font-size: clamp(15px, 2.4vmin, 20px); white-space: nowrap; }
#coins b { color: var(--gold); }
#coins .neg { color: var(--bad); }

/* ---------- tool bar */
#bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch; gap: 8px; padding: 8px 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); z-index: 3; }
#bar .grp { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.tool { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 64px; padding: 5px 6px; border-radius: 16px; border: 2px solid var(--line); background: linear-gradient(#262d3e, #1a1f2c); font-weight: 900; font-size: 13px; box-shadow: 0 4px 0 #05060a; }
.tool canvas { width: 40px; height: 40px; }
.tool .cost { color: var(--gold); font-size: 12px; }
.tool.on { border-color: var(--gold); background: linear-gradient(#4f4320, #2c2512); }
.act { min-width: 92px; border-radius: 16px; border: 2px solid var(--line); font-weight: 900; font-size: clamp(17px, 2.6vmin, 22px); padding: 8px 12px; box-shadow: 0 4px 0 #05060a; background: linear-gradient(#2e3648, #1d2230); }
.act:active, .tool:active, .btn:active, .hbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #05060a; }
#undoBtn { min-width: 116px; font-size: clamp(19px, 2.9vmin, 26px); }
#testBtn { background: linear-gradient(#2f6b3f, #1d4428); border-color: #4f9a64; }
#nightBtn { background: linear-gradient(#3a2d6b, #221a44); border-color: #7b66c9; }
#nightBtn.ready { box-shadow: 0 0 24px #9b7bff, 0 4px 0 #05060a; animation: pulse 1.3s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 6px #9b7bff, 0 4px 0 #05060a; } }
.act:disabled, .tool:disabled { opacity: .35; }

/* ---------- toast */
#toast { position: fixed; left: 50%; top: 72px; transform: translateX(-50%); z-index: 6; background: #10131bee; border: 2px solid var(--line); border-radius: 16px; padding: 10px 18px; font-weight: 900; font-size: clamp(16px, 2.6vmin, 22px); text-align: center; max-width: calc(100% - 32px); pointer-events: none; transition: opacity .25s; }
#toast.gold { border-color: var(--gold); color: #ffe7a3; }
#toast.bad { border-color: var(--bad); }
#toast.good { border-color: var(--good); }

/* ---------- screens + cards */
.screen { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px 16px; text-align: center; overflow-y: auto; }
.screen.dim { background: #05060acc; }
.screen h1 { font-family: Creepster, Nunito, sans-serif; font-weight: 400; font-size: clamp(54px, 13vmin, 140px); margin: 0; letter-spacing: 4px; color: #b9ffd6; text-shadow: 0 0 30px #3dff9a88, 0 6px 0 #0c3a22; line-height: 1; }
.screen h2 { font-family: Creepster, Nunito, sans-serif; font-weight: 400; font-size: clamp(34px, 7vmin, 62px); margin: 0; letter-spacing: 2px; color: #ffd98a; }
.screen p { margin: 0; color: var(--dim); font-size: clamp(16px, 2.6vmin, 22px); font-weight: 800; }
.btn { border-radius: 18px; border: 2px solid #5b6fa0; background: linear-gradient(#34406a, #222a46); padding: 12px 26px; font-size: clamp(19px, 3vmin, 26px); font-weight: 900; box-shadow: 0 5px 0 #05060a; min-width: 200px; }
.btn.go { border-color: #4f9a64; background: linear-gradient(#2f7a45, #1d4a2b); }
.btn.small { min-width: 0; font-size: 18px; padding: 10px 18px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.card { background: #141824f2; border: 2px solid var(--line); border-radius: 24px; padding: 18px 20px; width: min(620px, 100%); box-shadow: 0 12px 50px #000c; display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* level select */
.region { width: min(860px, 100%); background: #141824cc; border: 2px solid var(--line); border-radius: 20px; padding: 10px 14px 14px; }
.region h3 { margin: 0 0 8px; font-family: Creepster, Nunito, sans-serif; font-weight: 400; font-size: clamp(24px, 4vmin, 34px); letter-spacing: 1px; color: #ffd98a; text-align: left; }
.lvls { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.lvl { border-radius: 16px; border: 2px solid var(--line); background: linear-gradient(#273047, #1a2032); padding: 8px 4px; font-weight: 900; font-size: clamp(20px, 3.4vmin, 30px); box-shadow: 0 4px 0 #05060a; display: flex; flex-direction: column; align-items: center; }
.lvl small { font-size: clamp(11px, 1.8vmin, 15px); color: var(--gold); letter-spacing: 1px; min-height: 1.2em; }
.lvl:disabled { opacity: .35; }
@media (max-width: 560px) { .lvls { grid-template-columns: repeat(3, 1fr); } }

/* dispatcher */
#orders .card { border-color: #8a6a3a; background: linear-gradient(#2a1f14f5, #18120cf5); }
.tele { display: flex; align-items: center; gap: 10px; align-self: stretch; }
.tele .key { width: 48px; height: 48px; flex: none; }
.tele b { font-family: Creepster, Nunito, sans-serif; font-weight: 400; font-size: 28px; color: #ffcf7a; letter-spacing: 1px; }
.tele span { margin-left: auto; color: #c9a873; font-weight: 900; }
#oText { font-family: "Courier New", ui-monospace, monospace; font-weight: 700; font-size: clamp(19px, 3vmin, 26px); line-height: 1.35; color: #fff1d6; background: #f3e3c014; border: 2px dashed #8a6a3a; border-radius: 14px; padding: 12px 14px; align-self: stretch; text-align: left; min-height: 4.2em; }
#oHint { color: #ffd98a; font-weight: 900; font-size: clamp(16px, 2.6vmin, 21px); min-height: 1.3em; }
#oDisp { font-size: clamp(34px, 6vmin, 52px); font-weight: 900; min-width: 180px; padding: 2px 16px; border-radius: 14px; background: #00000055; border: 2px solid #8a6a3a; letter-spacing: 2px; min-height: 1.4em; }
#oPad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(340px, 100%); }
#oPad button, #oYN button { border-radius: 16px; border: 2px solid #8a6a3a; background: linear-gradient(#4a3720, #2c2113); font-size: clamp(24px, 4vmin, 34px); font-weight: 900; padding: 8px 0; box-shadow: 0 4px 0 #0a0603; }
#oPad button:active, #oYN button:active { transform: translateY(3px); box-shadow: 0 1px 0 #0a0603; }
#oYN { display: flex; gap: 14px; }
#oYN button { min-width: 140px; }
#oCard.shake { animation: shake .35s; }
#oCard.right { border-color: var(--good); }
@keyframes shake { 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }

/* win */
.stars { font-size: clamp(50px, 10vmin, 84px); letter-spacing: 8px; line-height: 1; }
.stars .off { opacity: .2; filter: grayscale(1); }
.why { text-align: left; font-weight: 800; font-size: clamp(16px, 2.5vmin, 20px); display: flex; flex-direction: column; gap: 4px; }
.why .no { color: var(--dim); }
#winGift { color: var(--ghost); font-weight: 900; font-size: clamp(18px, 2.8vmin, 23px); }

/* train yard */
#yardPrev { width: min(560px, 100%); height: 120px; border-radius: 18px; background: #0e1520; border: 2px solid var(--line); }
.slot { width: min(720px, 100%); text-align: left; }
.slot h4 { margin: 4px 0; font-size: 18px; color: var(--dim); }
.skins { display: flex; gap: 8px; flex-wrap: wrap; }
.skin { border-radius: 14px; border: 2px solid var(--line); background: #1d2333; padding: 8px 12px; font-weight: 900; font-size: 16px; box-shadow: 0 3px 0 #05060a; }
.skin.on { border-color: var(--ghost); color: var(--ghost); }
.skin:disabled { opacity: .45; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <button class="hbtn" id="backBtn" aria-label="Levels">◀</button>
  <div id="lvlName"></div>
  <div id="coins"></div>
  <button class="hbtn" id="muteBtn" aria-label="Sound">🔊</button>
</div>

<div id="bar" hidden>
  <div class="grp" id="tools"></div>
  <div class="grp">
    <button class="act" id="undoBtn">↶ Undo</button>
    <button class="act" id="testBtn">▶ Test</button>
    <button class="act" id="nightBtn">🌙 Midnight</button>
  </div>
</div>

<div id="toast" hidden></div>

<div class="screen" id="title">
  <h1>Midnight Line</h1>
  <p>Lay the track. Fill the orders. Survive the midnight run.</p>
  <div class="row">
    <button class="btn go" id="playBtn">▶ Play</button>
  </div>
  <div class="row">
    <button class="btn small" id="yardBtn">🚂 Train Yard</button>
    <button class="btn small" id="sandBtn">🏗️ Sandbox</button>
  </div>
</div>

<div class="screen dim" id="levels" hidden>
  <h2>Pick a level</h2>
  <div id="regions" style="display:flex;flex-direction:column;gap:12px;align-items:center;width:100%"></div>
  <button class="btn small" data-home>◀ Back</button>
</div>

<div class="screen dim" id="yard" hidden>
  <h2>Train Yard</h2>
  <p id="yardStars"></p>
  <canvas id="yardPrev"></canvas>
  <p id="yardSet" style="min-height:1.4em;margin:4px 0;font-weight:900;color:var(--ghost)"></p>
  <button class="btn small" id="yardRandom">🎲 Surprise me</button>
  <div id="slots" style="display:flex;flex-direction:column;gap:6px;align-items:center;width:100%"></div>
  <button class="btn small" data-home>◀ Back</button>
</div>

<div class="screen dim" id="orders" hidden>
  <div class="card" id="oCard">
    <div class="tele"><button class="hbtn" id="oBack" aria-label="Levels">◀</button><canvas class="key" id="teleIcon" width="96" height="96"></canvas><b>Dispatcher</b><span id="oCount"></span></div>
    <div id="oText"></div>
    <div id="oHint"></div>
    <div id="oDisp"></div>
    <div id="oPad"></div>
    <div id="oYN"><button data-yn="yes">Yes</button><button data-yn="no">No</button></div>
  </div>
</div>

<div class="screen dim" id="win" hidden>
  <div class="card">
    <h2 id="winTitle">Midnight delivery!</h2>
    <div class="stars" id="winStars"></div>
    <div class="why" id="winWhy"></div>
    <div id="winGift"></div>
    <div id="winMon" style="font-weight:900"></div>
    <div id="winNew" style="color:var(--gold);font-weight:900"></div>
    <div class="row">
      <button class="btn go small" id="nextBtn">Next ▶</button>
      <button class="btn small" id="againBtn">↻ Again</button>
      <button class="btn small" id="winLvls">Levels</button>
    </div>
  </div>
</div>

<div class="screen dim" id="derail" hidden>
  <div class="card">
    <h2 id="derailTitle">Derailed!</h2>
    <p id="derailWhy">The Midnight Express rolled off into the fog.</p>
    <div class="row">
      <button class="btn go" id="retryBtn" hidden>🌙 Try again</button>
      <button class="btn" id="fixBtn">🔧 Fix the line</button>
    </div>
  </div>
</div>

<script>

function regionOf(idx) { return Math.floor(idx / 6); }

function makeLevel(def, idx) {
  const terr = new Array(W * H), stAt = {}, byId = {}, stations = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = def.map[y][x], i = y * W + x;
    if (/[A-Fa-f]/.test(ch)) {
      const id = ch.toUpperCase(), m = def.st[id] || ["Station", "🚉"];
      const st = { id, i, x, y, mask: ch === id ? (EB | WB) : (NB | SB), name: m[0], icon: m[1] };
      stAt[i] = st; byId[id] = st; stations.push(st); terr[i] = ".";
    } else terr[i] = ch;
  }
  const trains = def.trains || [{ from: "A", stops: stations.filter(s => s.id !== "A").map(s => s.id) }];
  return Object.assign({}, def, { idx, terr, stAt, byId, stations, trains, region: def.sandbox ? 0 : regionOf(idx) });
}

function newGame(L) { return { L, track: new Array(W * H).fill(null) }; }
function stepDir(a, b) { for (let d = 0; d < 4; d++) if (nbr(a, d) === b) return d; return -1; }

function canPlace(L, i, k) { if (L.stAt[i]) return false; const t = L.terr[i]; return t === "." || ((t === "~" || t === "^") && k === "s"); }
function pieceCost(L, i, p) { if (p.k === "s") { if (L.terr[i] === "~") return BRIDGE; if (L.terr[i] === "^") return TUNNEL; } return PIECES[p.k].cost; }
function trackCost(G) { let c = 0; G.track.forEach((p, i) => { if (p) c += pieceCost(G.L, i, p); }); return c; }
function isTerminus(G, i) { const st = G.L.stAt[i]; let n = 0; for (let d = 0; d < 4; d++) if ((st.mask >> d & 1) && link(G, i, d) >= 0) n++; return n <= 1; }
function exits(G, i, e) {
  const c = conn(G, i), out = [];
  for (let d = 0; d < 4; d++) if ((c >> d & 1) && d !== e) out.push(d);
  if (e !== 4 && !G.L.noReverse && G.L.stAt[i] && isTerminus(G, i)) out.push(e);
  return out;
}
function applySolution(G) {
  G.track.fill(null);
  G.L.sol.forEach((row, y) => [...row].forEach((ch, x) => { const s = SOL[ch]; if (s) G.track[y * W + x] = { k: s[0], r: s[1] }; }));
}
function popcount(m) { let n = 0; while (m) { n += m & 1; m >>= 1; } return n; }
const skey = (i, e, m) => ((i * 5 + e) << 6) | m;
const kTile = k => Math.floor((k >> 6) / 5), kEntry = k => (k >> 6) % 5, kMask = k => k & 63;
const posAt = (path, t) => path[Math.min(t, path.length - 1)];

function stopSetup(G, tr) {
  const stops = tr.stops.map(id => G.L.byId[id]), stopBit = {};
  stops.forEach((s, k) => { stopBit[s.i] = 1 << k; });
  const full = (1 << stops.length) - 1, si = G.L.byId[tr.from].i;
  // done when every stop is visited (and, on loop levels, the train is back at its depot)
  const atGoal = k => kMask(k) === full && (!G.L.back || (kTile(k) === si && kEntry(k) !== 4));
  return { stops, stopBit, si, atGoal };
}

// Shortest walk from the train's depot through all its stops. Trains reverse only at dead-end stations.
// On failure it returns the walk to the first broken end (or the furthest it got) for the ⚠ marker.
function planTrain(G, tr, avoid) {
  const L = G.L, { stops, stopBit, si, atGoal } = stopSetup(G, tr);
  const prev = new Map(), q = [skey(si, 4, 0)];
  prev.set(q[0], -1);
  let broken = null, best = q[0], bestN = 0;
  const recon = k => { const p = []; while (k !== -1) { p.push(kTile(k)); k = prev.get(k); } return p.reverse(); };
  for (let h = 0; h < q.length; h++) {
    const k = q[h], m = kMask(k), e = kEntry(k), i = kTile(k);
    if (atGoal(k)) return { ok: true, path: recon(k) };
    if (popcount(m) > bestN) { bestN = popcount(m); best = k; }
    for (const d of exits(G, i, e)) {
      const j = link(G, i, d);
      if (j < 0 || (avoid && avoid.has(j))) {
        if (!broken && !L.stAt[i]) broken = { k, d, at: j >= 0 ? j : (nbr(i, d) >= 0 ? nbr(i, d) : i), why: j >= 0 ? "blocked" : "gap" };
        continue;
      }
      const nk = skey(j, OPP[d], m | (stopBit[j] || 0));
      if (!prev.has(nk)) { prev.set(nk, k); q.push(nk); }
    }
  }
  if (broken) return { ok: false, path: recon(broken.k), fail: { dir: broken.d, at: broken.at, why: broken.why } };
  const got = kMask(best), miss = stops.find((s, k) => !(got >> k & 1));
  return { ok: false, path: recon(best), fail: { dir: -1, at: miss ? miss.i : si, why: miss ? "reach" : "home" } };
}

// Second train: the same search through time, waiting at signals so it never meets the first train
// (or sits on a square the first train still has to pass).
function planTimed(G, tr, p1) {
  const { stopBit, si, atGoal } = stopSetup(G, tr);
  const T = p1.length + 80, SZ = W * H * 5 * 64;
  const at1 = t => posAt(p1, t);
  const last1 = new Map(); p1.forEach((x, k) => last1.set(x, k)); last1.set(p1[p1.length - 1], Infinity);
  const par = new Map();   // time-stamped state → the state it came from (doubles as the visited set)
  let layer = [skey(si, 4, 0)]; par.set(layer[0], undefined);
  for (let t = 0; t < T && layer.length; t++) {
    const next = [];
    for (const k of layer) {
      const m = kMask(k), e = kEntry(k), i = kTile(k);
      if (atGoal(k) && (last1.has(i) ? last1.get(i) : -9) < t - 1) {
        const path = []; let tk = t * SZ + k;
        while (tk !== undefined) { path.push(kTile(tk % SZ)); tk = par.get(tk); }
        return { ok: true, path: path.reverse() };
      }
      const moves = [[i, e, m]];
      for (const d of exits(G, i, e)) { const j = link(G, i, d); if (j >= 0) moves.push([j, OPP[d], m | (stopBit[j] || 0)]); }
      for (const [j, ne, nm] of moves) {
        if (j === at1(t + 1) || j === at1(t) || i === at1(t + 1)) continue;
        const nk = skey(j, ne, nm), tk = (t + 1) * SZ + nk;
        if (par.has(tk)) continue;
        par.set(tk, t * SZ + k); next.push(nk);
      }
    }
    layer = next;
  }
  return { ok: false };
}

function reachable(G, from) {
  const seen = new Set([skey(from, 4, 0)]), q = [skey(from, 4, 0)], tiles = new Set([from]);
  for (let h = 0; h < q.length; h++) {
    const k = q[h], i = kTile(k), e = kEntry(k);
    for (const d of exits(G, i, e)) {
      const j = link(G, i, d); if (j < 0) continue;
      const nk = skey(j, OPP[d], 0); if (!seen.has(nk)) { seen.add(nk); q.push(nk); tiles.add(j); }
    }
  }
  return tiles;
}

function trainsFor(G) {
  if (!G.L.sandbox) return G.L.trains;
  const r = reachable(G, G.L.byId.A.i);
  return [{ from: "A", stops: G.L.stations.filter(s => s.id !== "A" && r.has(s.i)).map(s => s.id) }];
}

// Plan every train. ok=true means each train reaches all its stops (and home, on loop levels) without a crash.
function runAll(G) {
  const trs = trainsFor(G);
  if (trs.length === 1) { const p = planTrain(G, trs[0], null); return { ok: p.ok, trains: [p] }; }
  const d1 = G.L.byId[trs[0].from].i, d2 = G.L.byId[trs[1].from].i;
  const p1 = planTrain(G, trs[0], new Set([d2]));
  if (!p1.ok) return { ok: false, trains: [p1, { ok: false, path: [d2], idle: true }] };
  const p2 = planTimed(G, trs[1], p1.path);
  if (p2.ok) return { ok: true, trains: [p1, p2] };
  const q2 = planTrain(G, trs[1], new Set([d1]));
  if (!q2.ok) return { ok: false, trains: [p1, q2] };
  const at = posAt, n = Math.max(p1.path.length, q2.path.length) + 2;
  let t = 1;
  for (; t < n; t++) {
    const a = at(p1.path, t), b = at(q2.path, t), pa = at(p1.path, t - 1), pb = at(q2.path, t - 1);
    if (a === b || a === pb || b === pa) break;
  }
  t = Math.min(t, n - 1);
  const crashAt = at(q2.path, t) === at(p1.path, t) || at(q2.path, t) === at(p1.path, t - 1) ? at(q2.path, t) : at(p1.path, t);
  return { ok: false, crash: { t, at: crashAt }, trains: [{ ok: false, path: p1.path.slice(0, t + 1) }, { ok: false, path: q2.path.slice(0, t + 1) }] };
}

/* ---------- Orders: a light Leitner box per fact, tables unlock in Door Codes' order. */
const TABLES = [2, 10, 5, 3, 4, 11, 6, 9, 8, 7, 12];
const BOX_W = [6, 4, 2, 1, 0.35];
const CARGO = ["coal", "bones", "pumpkins", "rocks", "candy", "lanterns"];
function newMem() { return { facts: {}, tier: 3, recent: [], due: [] }; }
function ri(r, a, b) { return a + Math.floor(r() * (b - a + 1)); }
function pickOf(r, a) { return a[Math.floor(r() * a.length)]; }
function mkey(a, b) { return `m:${Math.min(a, b)}x${Math.max(a, b)}`; }
function boxOf(mem, key) { return mem.facts[key] ? mem.facts[key].box : 0; }
function pickFact(mem, r) {
  const ts = TABLES.slice(0, mem.tier), items = [];
  let total = 0;
  for (const t of ts) for (let b = 2; b <= 12; b++) {
    const key = mkey(t, b);
    const w = BOX_W[boxOf(mem, key)] * (mem.due.includes(key) ? 8 : 1) * (t === ts[ts.length - 1] ? 2 : 1);
    items.push({ t, b, key, w }); total += w;
  }
  let x = r() * total;
  for (const it of items) { x -= it.w; if (x <= 0) return it; }
  return items[items.length - 1];
}
function fmtTime(min) { let h = Math.floor(min / 60) % 12; if (h === 0) h = 12; return `${h}:${String(min % 60).padStart(2, "0")}`; }

function genOrder(kind, mem, r, lvl) {
  const big = lvl >= 3;
  if (kind === "afford") {
    const item = r() < 0.5 ? { name: "bridge", c: BRIDGE, unit: "curves" } : { name: "tunnel", c: TUNNEL, unit: "straights" };
    const n = ri(r, 1, big ? 9 : 5), cost = item.c + n;
    const C = Math.max(3, cost + pickOf(r, [-3, -2, -1, 0, 1, 2, 4]));
    return { kind, input: "yn", text: `You have ${C} coins. Can you buy a ${item.name} and ${n} ${item.unit}?`,
      ans: cost <= C ? "yes" : "no", key: `a:${item.c}+${n}`, n: { C, base: item.c, n },
      hint: `A ${item.name} is ${item.c}. Each of the ${item.unit} is 1. Add them up, then check: is it ${C} or less?` };
  }
  if (kind === "spend") {
    const a = ri(r, 2, big ? 15 : 9), b = ri(r, 2, big ? 12 : 9);
    return { kind, input: "num", text: `Track costs ${a} coins. A lamp costs ${b} coins. How many coins in all?`,
      ans: a + b, key: `a:${a}+${b}`, n: { a, b }, hint: b <= 5 ? `Start at ${a} and count up ${b}.` : `${a} + ${b}. Make a ten first!` };
  }
  if (kind === "left") {
    const C = ri(r, 10, big ? 30 : 20), a = ri(r, 2, C - 2);
    return { kind, input: "num", text: `You have ${C} coins. You spend ${a}. How many are left?`,
      ans: C - a, key: `s:${C}-${a}`, n: { C, a }, hint: `Count up from ${a} to ${C}.` };
  }
  if (kind === "tons" || kind === "pull") {
    const f = pickFact(mem, r), swap = r() < 0.5, cars = swap ? f.t : f.b, per = swap ? f.b : f.t, cargo = pickOf(r, CARGO), total = cars * per;
    const skip = Array.from({ length: Math.min(cars, 4) }, (_, k) => per * (k + 1)).join(", ");
    if (kind === "tons") return { kind, input: "num", key: f.key, t: f.t, n: { cars, per },
      text: `The mine needs ${cars} cars of ${cargo}. Each car holds ${per} tons. How many tons in all?`,
      ans: total, hint: `${cars} × ${per}. Count by ${per}s: ${skip}…` };
    const limit = Math.max(per, total + pickOf(r, [-per, -2, 0, 3, per, 2 * per]));
    return { kind, input: "yn", key: f.key, t: f.t, n: { cars, per, limit },
      text: `${cars} cars of ${cargo}. Each car holds ${per} tons. Your engine pulls ${limit} tons. Can one train do it?`,
      ans: total <= limit ? "yes" : "no", hint: `${cars} × ${per} tons. Count by ${per}s: ${skip}… Is it ${limit} or less?` };
  }
  if (kind === "trips") {
    const f = pickFact(mem, r), per = f.t, n = f.b, P = per * n;
    return { kind, input: "num", key: f.key, t: f.t, n: { P, per },
      text: `How many trips to move ${P} tons with a ${per}-ton car?`, ans: n, hint: `${per} × ? = ${P}. Count by ${per}s until you get to ${P}.` };
  }
  if (kind === "area") {
    const f = pickFact(mem, r), swap = r() < 0.5, long = swap ? f.b : f.t, wide = swap ? f.t : f.b;
    const skip = Array.from({ length: Math.min(long, 4) }, (_, k) => wide * (k + 1)).join(", ");
    return { kind, input: "num", key: f.key, t: f.t, n: { long, wide },
      text: `The witch's pumpkin patch is ${long} squares long and ${wide} squares wide. How many squares is it in all?`,
      ans: long * wide, hint: `${long} rows of ${wide}. Count by ${wide}s: ${skip}…` };
  }
  if (kind === "fence") {
    const long = ri(r, 3, big ? 12 : 8), wide = ri(r, 2, Math.min(long, 9));
    return { kind, input: "num", key: `p:${long}x${wide}`, n: { long, wide },
      text: `A fence goes all the way around a garden ${long} feet long and ${wide} feet wide. How many feet of fence?`,

  for (let k = 0; k < 70; k++) { ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.5 * Math.abs(Math.sin(t * 0.7 + k))})`; ctx.fillRect(hash(k) * VW, hash(k + 100) * VH * 0.6, 2, 2); }
  ctx.fillStyle = "#f3f0d8"; ctx.beginPath(); ctx.arc(VW * 0.82, VH * 0.18, Math.min(VW, VH) * 0.08, 0, 7); ctx.fill();
  ctx.fillStyle = "#070a16"; ctx.beginPath(); ctx.arc(VW * 0.8, VH * 0.17, Math.min(VW, VH) * 0.075, 0, 7); ctx.fill();
  ctx.fillStyle = "#0b1118"; ctx.beginPath(); ctx.moveTo(0, VH * 0.8);
  for (let x = 0; x <= VW + 40; x += 40) ctx.lineTo(x, VH * 0.78 - Math.sin(x * 0.006) * 40 - Math.sin(x * 0.017) * 18);
  ctx.lineTo(VW, VH); ctx.lineTo(0, VH); ctx.fill();
  const s = Math.min(90, VW / 10), ty = VH * 0.86, head = ((t * s * 1.6) % (VW + s * 6)) - s;
  drawRails(ctx, ty, s, VW);
  ctx.save(); ctx.globalCompositeOperation = "lighter"; glow(ctx, head - s * 0.6, ty, s * 1.6, "60,255,140", 0.25); ctx.restore();
  drawConsist(ctx, head, ty, s, ["🍬"], true);
}
function drawRails(c, y, s, w) {
  c.fillStyle = "#3b2a1c"; for (let x = 0; x < w + s; x += s * 0.25) c.fillRect(x, y - s * 0.16, s * 0.06, s * 0.32);
  c.strokeStyle = "#8a8b94"; c.lineWidth = 3; for (const o of [-0.1, 0.1]) { c.beginPath(); c.moveTo(0, y + o * s); c.lineTo(w, y + o * s); c.stroke(); }
}
function drawConsist(c, x, y, s, icons, ghost) {   // engine heading right at x, then tender, cars, caboose
  drawEngine(c, x, y, 0, s, S.skins.engine, ghost);
  drawCar(c, x - s * 0.56, y, 0, s, "tender", S.skins.tender, null, ghost);
  icons.forEach((ic, k) => drawCar(c, x - s * (1.03 + k * 0.47), y, 0, s, "car", S.skins.car, ic, ghost));
  drawCar(c, x - s * (1.03 + icons.length * 0.47), y, 0, s, "caboose", S.skins.caboose, null, ghost);
}


function frame(now) {
  const t = now / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (scene !== "play" || !G) { drawMenuBg(t); requestAnimationFrame(frame); return; }
  const shk = G.run && G.run.shakeT ? clamp(1 - (now - G.run.shakeT) / 350, 0, 1) * TS * 0.12 : 0;
  if (shk) ctx.setTransform(DPR, 0, 0, DPR, (Math.random() - 0.5) * shk * DPR, (Math.random() - 0.5) * shk * DPR);
  night += (nightTarget - night) * 0.04;
  ctx.fillStyle = night > 0.5 ? "#06080d" : "#121a14"; ctx.fillRect(0, 0, VW, VH);
  updateRun(now);
  drawBoard(); drawTerrainAnim(t); drawLamps(t);
  drawTrains(false);
  if (night > 0.01) {
    ctx.fillStyle = `rgba(4,8,24,${0.74 * night})`; ctx.fillRect(0, 0, VW, VH);
    for (const st of G.L.stations) glow(ctx, OX + (st.x + 0.5) * TS, OY + (st.y + 0.5) * TS, TS * 0.9, "255,200,100", 0.18 * night);   // lamps through the dark
  }
  drawBeat(t); drawMonsters(now, t); drawTrains(true); drawFog(t); drawWarn(t); drawFx(now); drawLanterns(now); drawHover();
  requestAnimationFrame(frame);
}

/* =====================================================================
   UI: screens, HUD, tools, dispatcher.
   ===================================================================== */
function show(name, overlay) {
  if (overlay) { $(name).hidden = false; return; }
  for (const id of ["title", "levels", "yard", "orders", "win", "derail"]) $(id).hidden = id !== name;
  scene = name;
  $("hud").hidden = $("bar").hidden = name !== "play";
  if (name === "levels") buildLevels();
  if (name === "yard") buildYard();
  if (name === "title") $("sandBtn").textContent = cleared(5) ? "🏗️ Sandbox" : "🔒 Sandbox";
  layout();
}
function hideOverlays() { for (const id of ["orders", "win", "derail"]) $(id).hidden = true; }
let toastTimer = 0;
function toast(msg, cls = "", ms = 2400) {
  const el = $("toast"); el.textContent = msg; el.className = cls; el.hidden = false; el.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.style.opacity = 0; setTimeout(() => { el.hidden = true; }, 260); }, ms);
}

const TOOLS = [
  ...["s", "c", "w"].map(k => ({ id: k, label: PIECES[k].name, cost: PIECES[k].cost })),
  { id: "b", label: "Bridge", cost: BRIDGE, need: "~" }, { id: "t", label: "Tunnel", cost: TUNNEL, need: "^" }, { id: "e", label: "Erase", cost: 0 },
];
function buildTools() {
  const box = $("tools"); box.innerHTML = "";
  for (const tl of TOOLS) {
    if (tl.need && !G.L.terr.includes(tl.need)) continue;
    const b = document.createElement("button"); b.className = "tool" + (G.tool === tl.id ? " on" : ""); b.dataset.tool = tl.id;
    const c = document.createElement("canvas"); c.width = c.height = 80; b.appendChild(c);
    b.insertAdjacentHTML("beforeend", `<span>${tl.label}</span>${tl.cost ? `<span class="cost">🪙 ${tl.cost}</span>` : ""}`);
    toolIcon(c.getContext("2d"), tl.id);
    b.onclick = () => { audio(); G.tool = tl.id; box.querySelectorAll(".tool").forEach(x => x.classList.toggle("on", x === b)); };
    box.appendChild(b);
  }
}
function toolIcon(c, id) {
  const ts = 64, o = 8;
  c.clearRect(0, 0, 80, 80);
  if (id === "e") { c.font = "46px system-ui, 'Apple Color Emoji'"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText("🧹", 40, 42); return; }
  const terr = id === "b" ? "~" : id === "t" ? "^" : ".";
  c.fillStyle = id === "b" ? COL.river : id === "t" ? "#5b5560" : "#4d6640"; roundRect(c, o, o, ts, ts, 10); c.fill();
  const mask = id === "c" ? PIECES.c.rots[1] : id === "w" ? PIECES.w.rots[2] : PIECES.s.rots[0];
  drawPieceAt(c, 0, mask, ts, o, o, terr);
}
function updateHud() {
  if (!G) return;
  const L = G.L;
  $("lvlName").textContent = L.sandbox ? "Sandbox" : `${L.region + 1}-${L.idx % 6 + 1} ${L.name}`;
  const spent = trackCost(G);
  $("coins").innerHTML = L.sandbox ? `🪙 <b>${spent}</b> spent · ∞` : `🪙 <b>${spent}</b> spent · <span class="${L.budget - spent < 0 ? "neg" : ""}">${L.budget - spent} left</span>`;
  const running = !!G.run || G.orders.some(o => !o.done);
  $("undoBtn").disabled = running || !G.undo.length;
  $("testBtn").disabled = running; $("nightBtn").disabled = running;
  $("nightBtn").classList.toggle("ready", G.tested && !running);
  $("muteBtn").textContent = S.muted ? "🔇" : "🔊";
}

/* ---------- dispatcher */
let typing = 0, entry = "";
function openOrders() {
  if (!G) return;
  G.oi = G.orders.findIndex(o => !o.done); if (G.oi < 0) return;
  hideOverlays(); $("orders").hidden = false; showOrder();
}
function showOrder() {
  const o = G.orders[G.oi]; entry = "";
  $("oCount").textContent = `Order ${G.oi + 1} of ${G.orders.length}`;
  $("oHint").textContent = ""; $("oCard").classList.remove("right");
  const pad = $("oPad"); pad.innerHTML = "";
  [1, 2, 3, 4, 5, 6, 7, 8, 9, "⌫", 0, "✓"].forEach(k => { const b = document.createElement("button"); b.textContent = k; b.dataset.k = k; pad.appendChild(b); });
  const yn = o.input === "yn";
  $("oPad").hidden = yn; $("oDisp").hidden = yn; $("oYN").hidden = !yn;
  renderEntry();
  clearInterval(typing);
  const el = $("oText"); el.textContent = ""; let k = 0;
  typing = setInterval(() => { k++; el.textContent = o.text.slice(0, k); if (k % 3 === 0) SFX.clack(); if (k >= o.text.length) clearInterval(typing); }, 22);
}
function renderEntry() {
  const o = G.orders[G.oi];
  $("oDisp").textContent = o.input === "time" ? (entry.length >= 3 ? `${entry.slice(0, -2)}:${entry.slice(-2)}` : entry || "_:__") : (entry || "?");
}
function answer(input) {
  const o = G.orders[G.oi]; if (o.done) return;
  clearInterval(typing); $("oText").textContent = o.text;
  if (checkAnswer(o, input)) {
    o.done = true; SFX.right();
    const un = recordOrder(o, !o.missed, S); save();
    $("oCard").classList.add("right"); $("oHint").textContent = o.missed ? "✓ Got it!" : "✓ Right the first time!";
    if (un) setTimeout(() => toast(`🔓 New cargo numbers: the ${un}s!`, "gold", 3000), 600);
    const g = G; setTimeout(() => { if (G === g) nextOrder(); }, 1000);
  } else {
    if (!o.missed) { o.missed = true; G.firstTryAll = false; }
    SFX.wrong(); entry = ""; renderEntry();
    $("oHint").textContent = "Not quite. " + o.hint;
    const c = $("oCard"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
  }
}
function nextOrder() {
  if (!G) return;
  const k = G.orders.findIndex(o => !o.done);
  if (k < 0) { $("orders").hidden = true; updateHud(); toast(G.L.tip, "", 4200); return; }
  G.oi = k; showOrder();
}
$("oPad").addEventListener("click", e => {
  const k = e.target.dataset && e.target.dataset.k; if (k == null) return;
  const o = G.orders[G.oi];
  if (k === "⌫") entry = entry.slice(0, -1);
  else if (k === "✓") { if (entry) answer(o.input === "time" ? entry : Number(entry)); return; }
  else if (entry.length < 4) entry += k;
  SFX.clack(); renderEntry();
});
$("oYN").addEventListener("click", e => { const v = e.target.dataset && e.target.dataset.yn; if (v) answer(v); });
(function teleIcon() {   // the dispatcher's telegraph key
  const c = $("teleIcon").getContext("2d");
  c.fillStyle = "#5a3d20"; roundRect(c, 6, 60, 84, 26, 6); c.fill();
  c.fillStyle = "#c9a14a"; c.fillRect(20, 50, 56, 10);
  c.fillStyle = "#2a2a2a"; c.fillRect(44, 26, 8, 28);
  c.fillStyle = "#1b1b1b"; c.beginPath(); c.arc(48, 24, 12, 0, 7); c.fill();
  c.fillStyle = "#e0d4b0"; c.beginPath(); c.arc(48, 22, 6, 0, 7); c.fill();
})();

/* ---------- level select + train yard */
function buildLevels() {
  const box = $("regions"); box.innerHTML = "";
  REGIONS.forEach((rg, r) => {
    const sec = document.createElement("div"); sec.className = "region";
    sec.innerHTML = `<h3>${["🌫️", "⛏️", "👻", "🧙"][r]} ${rg.name}</h3><div class="lvls"></div>`;
    for (let k = 0; k < 6; k++) {
      const idx = r * 6 + k, b = document.createElement("button"); b.className = "lvl"; b.dataset.level = idx + 1;
      const st = S.best[idx] || 0;
      b.innerHTML = `${unlocked(idx) ? idx % 6 + 1 : "🔒"}<small>${st ? "★".repeat(st) + "☆".repeat(3 - st) : ""}</small>`;
      b.disabled = !unlocked(idx);
      b.onclick = () => { audio(); startLevel(idx + 1); };
      sec.querySelector(".lvls").appendChild(b);
    }
    box.appendChild(sec);
  });
}
function buildYard() {
  const tot = totalStars();
  $("yardStars").textContent = `⭐ ${tot} stars · 👾 ${S.zaps} monsters zapped`;
  const box = $("slots"); box.innerHTML = "";
  for (const slot in SKINS) {
    const d = document.createElement("div"); d.className = "slot";
    d.innerHTML = `<h4>${SLOT_NAMES[slot]}</h4><div class="skins"></div>`;
    for (const s of SKINS[slot]) {
      const b = document.createElement("button"); b.className = "skin" + (S.skins[slot] === s.id ? " on" : "");
      const open = tot >= s.need; b.disabled = !open;
      b.textContent = open ? s.name : `🔒 ${s.name} · ⭐${s.need}`;
      b.onclick = () => { S.skins[slot] = s.id; save(); SFX.couple(); buildYard(); };
      d.querySelector(".skins").appendChild(b);
    }
    box.appendChild(d);
  }
  const set = SETS.find(st => Object.keys(st).every(k => k === "name" || S.skins[k] === st[k]));
  $("yardSet").textContent = set ? `${set.name}!` : "";
  const c = $("yardPrev"), r = c.getBoundingClientRect(); c.width = r.width * DPR; c.height = r.height * DPR;
  // Redraw while the yard is open so skulls glow, spiders wiggle and cauldrons bubble
  const paint = () => {
    if ($("yard").hidden || c.dataset.gen !== gen) return;
    const x = c.getContext("2d"); x.setTransform(DPR, 0, 0, DPR, 0, 0); x.clearRect(0, 0, r.width, r.height);
    const s = Math.min(120, r.width / 3.6), y = r.height / 2, cx = r.width / 2 + s * 0.85;
    drawRails(x, y, s, r.width);
    drawConsist(x, cx, y, s, ["🍬", "🎃"], false);
    requestAnimationFrame(paint);
  };
  const gen = String(Math.random()); c.dataset.gen = gen; paint();
}
$("yardRandom").onclick = () => {
  const tot = totalStars();
  for (const slot in SKINS) { const open = SKINS[slot].filter(sk => tot >= sk.need); S.skins[slot] = open[Math.floor(Math.random() * open.length)].id; }
  save(); SFX.couple(); buildYard();
};

/* ---------- wiring */
$("playBtn").onclick = () => { audio(); show("levels"); };
$("yardBtn").onclick = () => { audio(); show("yard"); };
$("sandBtn").onclick = () => { audio(); if (cleared(5)) startLevel(0); else toast("Finish Foggy Valley to open the Sandbox.", "", 2600); };
document.querySelectorAll("[data-home]").forEach(b => b.onclick = () => show("title"));
$("backBtn").onclick = () => { if (G && G.run) return; G = null; hideOverlays(); show("levels"); };
$("oBack").onclick = () => { clearInterval(typing); G = null; hideOverlays(); show("levels"); };
$("muteBtn").onclick = () => { S.muted = !S.muted; save(); updateHud(); };
$("undoBtn").onclick = () => { if (busy() || !G.undo.length) return; G.track = G.undo.pop(); SFX.undo(); edited(); };
$("testBtn").onclick = () => { audio(); startRun("test"); };
$("nightBtn").onclick = () => { audio(); startRun("midnight"); };
$("nextBtn").onclick = () => { hideOverlays(); startLevel(G.L.idx + 2); };
$("againBtn").onclick = () => { hideOverlays(); startLevel(G.n); };
$("winLvls").onclick = () => { G = null; hideOverlays(); show("levels"); };
$("fixBtn").onclick = () => { hideOverlays(); nightTarget = 0; };
$("retryBtn").onclick = () => { audio(); hideOverlays(); startRun("midnight"); };

function tileAt(e) {
  const x = Math.floor((e.clientX - OX) / TS), y = Math.floor((e.clientY - OY) / TS);
  return x < 0 || y < 0 || x >= W || y >= H ? -1 : y * W + x;
}
cv.addEventListener("pointerdown", e => {
  if (scene === "play" && G && G.run && G.run.kind === "midnight") { zapAt(e.clientX, e.clientY); return; }
  if (scene !== "play" || busy()) return;
  audio();
  const i = tileAt(e); if (i < 0) return;
  cv.setPointerCapture(e.pointerId);
  paintStart(i);
});
cv.addEventListener("pointermove", e => {
  if (!G || !G.painting) return;
  const i = tileAt(e); if (i >= 0) paintTo(i);
});
cv.addEventListener("pointerup", e => {
  if (!G || !G.painting) return;
  const P = G.painting;
  if (!P.moved) { G.painting = null; tapTile(P.tiles[0]); return; }
  paintEnd();
});
cv.addEventListener("pointercancel", () => { if (G && G.painting) paintEnd(); });

/* =====================================================================
   Debug + test hooks: ?debug exposes window.__ml; ?test=midnight|derail|orders|monsters stages an event.
   ===================================================================== */
const QS = new URLSearchParams(location.search);
const api = {
  S, LEVELS, SANDBOX, W, H,
  get G() { return G; },
  loadLevel(n) { hideOverlays(); startLevel(n); return G; },
  skipOrders() { clearInterval(typing); G.orders.forEach(o => { o.done = true; }); $("orders").hidden = true; updateHud(); },
  solve() {   // lay the reference solution and settle every order first try
    hideOverlays(); clearInterval(typing);
    G.orders.forEach(o => { if (!o.done) { o.done = true; recordOrder(o, !o.missed, S); } });
    applySolution(G); G.undo = []; edited(); return G;
  },
  solutionPieces() { const g = newGame(G.L); applySolution(g); return g.track.map((p, i) => p && { i, x: i % W, y: Math.floor(i / W), k: p.k, r: p.r }).filter(Boolean); },
  tileCenter(x, y) { return { x: OX + (x + 0.5) * TS, y: OY + (y + 0.5) * TS }; },
  runAll: () => runAll(G), trackCost: () => trackCost(G), startRun, genOrder, levelOrders,
  // live monsters a tap would hit, in screen pixels
  monsters() { const now = performance.now(); return mons.filter(m => zappable(m, now)).map(m => ({ kind: m.kind, phase: m.phase, ...px({ x: m.x, y: m.y - 0.15 }) })); },
};
if (QS.has("debug")) window.__ml = api;
layout(); show("title"); requestAnimationFrame(frame);
if (document.fonts) document.fonts.ready.then(() => { fontGen++; layout(); });
const TEST = QS.get("test");
if (TEST) {
  if (TEST === "midnight") { api.loadLevel(4); api.solve(); G.tested = true; startRun("midnight"); }
  else if (TEST === "derail") { api.loadLevel(2); api.skipOrders(); applySolution(G); G.track[3 * W + 6] = null; startRun("midnight"); }   // one straight missing, never tested
  else if (TEST === "orders") api.loadLevel(14);
  else if (TEST === "monsters") { api.loadLevel(13); api.solve(); G.tested = true; startRun("midnight"); }
}
</script>
